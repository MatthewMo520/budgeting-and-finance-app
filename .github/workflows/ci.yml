name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: financeuser
          POSTGRES_PASSWORD: financepass
          POSTGRES_DB: financedb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financeuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests (unit + integration)
        working-directory: backend
        env:
          JWT_SECRET_KEY: test-secret-not-for-production
          TEST_DATABASE_URL: postgresql://financeuser:financepass@localhost:5432/financedb_test
        run: python -m pytest -q tests/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
